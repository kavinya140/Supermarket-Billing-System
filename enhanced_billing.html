<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Enhanced Billing Page</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .search-bar {
        margin-bottom: 20px;
        text-align: center;
      }
      .cart {
        margin-top: 30px;
      }
      .cart th,
      .cart td {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="billing-box">
        <h2>🛒 Product Catalog</h2>
        <input
          type="text"
          id="searchInput"
          class="search-bar"
          onkeyup="filterProducts()"
          placeholder="Search for items..."
        />
        <table id="productTable">
          <tr>
            <th>Item</th>
            <th>Price (₹)</th>
            <th>Action</th>
          </tr>
          <tr>
            <td>Milk</td>
            <td>30</td>
            <td><button onclick="addToCart('Milk', 30)">Add</button></td>
          </tr>
          <tr>
            <td>Bread</td>
            <td>25</td>
            <td><button onclick="addToCart('Bread', 25)">Add</button></td>
          </tr>
          <tr>
            <td>Butter</td>
            <td>45</td>
            <td><button onclick="addToCart('Butter', 45)">Add</button></td>
          </tr>
          <tr>
            <td>Cheese</td>
            <td>50</td>
            <td><button onclick="addToCart('Cheese', 50)">Add</button></td>
          </tr>
          <tr>
            <td>Cake</td>
            <td>100</td>
            <td><button onclick="addToCart('Cake', 100)">Add</button></td>
          </tr>
          <tr>
            <td>Tea</td>
            <td>20</td>
            <td><button onclick="addToCart('Tea', 20)">Add</button></td>
          </tr>
          <tr>
            <td>Coffee</td>
            <td>25</td>
            <td><button onclick="addToCart('Coffee', 25)">Add</button></td>
          </tr>
        </table>

        <div class="cart">
          <h2>🧾 Shopping Cart</h2>
          <table id="cartTable">
            <tr>
              <th>Item</th>
              <th>Qty</th>
              <th>Price</th>
              <th>Total</th>
              <th>Action</th>
            </tr>
          </table>
          <p id="subtotal">Subtotal: ₹0</p>
          <p id="tax">Tax (5%): ₹0</p>
          <p><strong id="grandTotal">Grand Total: ₹0</strong></p>
          <button onclick="alert(' Bill generated successfully!')">
            Generate Bill
          </button>
        </div>
      </div>
    </div>

    <script>
      const cart = {};

      function addToCart(item, price) {
        if (!cart[item]) {
          cart[item] = { qty: 1, price: price };
        } else {
          cart[item].qty += 1;
        }
        updateCartDisplay();
      }

      function removeFromCart(item) {
        if (cart[item]) {
          cart[item].qty -= 1;
          if (cart[item].qty <= 0) delete cart[item];
          updateCartDisplay();
        }
      }

      function updateCartDisplay() {
        const table = document.getElementById("cartTable");
        table.innerHTML =
          "<tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th><th>Action</th></tr>";
        let subtotal = 0;
        for (const item in cart) {
          const { qty, price } = cart[item];
          const total = qty * price;
          subtotal += total;
          table.innerHTML += `<tr>
          <td>${item}</td>
          <td>${qty}</td>
          <td>₹${price}</td>
          <td>₹${total}</td>
          <td><button onclick="removeFromCart('${item}')">Remove</button></td>
        </tr>`;
        }
        const tax = subtotal * 0.05;
        const grand = subtotal + tax;
        document.getElementById("subtotal").innerText =
          "Subtotal: ₹" + subtotal.toFixed(2);
        document.getElementById("tax").innerText =
          "Tax (5%): ₹" + tax.toFixed(2);
        document.getElementById("grandTotal").innerText =
          "Grand Total: ₹" + grand.toFixed(2);
      }

      function filterProducts() {
        const input = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const rows = document.querySelectorAll(
          "#productTable tr:not(:first-child)"
        );
        rows.forEach((row) => {
          const text = row.cells[0].innerText.toLowerCase();
          row.style.display = text.includes(input) ? "" : "none";
        });
      }
    </script>
  </body>
</html>
